name: Build QuantumDownloader APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flet-cli==0.85.2

      - name: Build APK
        run: |
          flet build apk \
            --project quantum_downloader \
            --product "QuantumDownloader" \
            --org "com.quantumdownload" \
            --build-version "3.1.0" \
            --build-number 1 \
            --module-name "main(flet)" \
            --yes \
            .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantumDownloader-APK
          path: build/apk/
          if-no-files-found: error
